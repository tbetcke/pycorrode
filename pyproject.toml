[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pycorrode"
version = "0.1.0"
description = "A just-in-time Rust compilation framework for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "nd-project" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=3.16",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.11",
]
examples = [
    "numpy>=1.26",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=1,<2",
    "pymdown-extensions>=10,<11",
]

[project.urls]
Documentation = "https://tbetcke.github.io/pycorrode/"
Homepage = "https://tbetcke.github.io/pycorrode/"
Repository = "https://github.com/tbetcke/pycorrode"
Issues = "https://github.com/tbetcke/pycorrode/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pycorrode"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/mkdocs.yml",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires a working Rust toolchain and access to the PyO3 crate",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ty>=0.0.65",
]
