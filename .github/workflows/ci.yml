name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev,docs,examples]"

      - name: Show tool versions
        run: |
          cargo --version
          python --version

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Run examples
        run: |
          python examples/double/example.py
          python examples/two_functions/example.py
          python examples/numpy_sum/example.py

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Build distributions
        run: python -m build
